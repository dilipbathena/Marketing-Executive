<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Marketing Executive</title><style>body{margin:0;background:#020617;color:#e2e8f0;font:16px system-ui}.wrap{max-width:980px;margin:auto;padding:38px 18px}.tag{color:#22d3ee;font-size:12px;font-weight:700;letter-spacing:.12em}h1{font-size:36px;margin:6px 0}p{color:#94a3b8}.card{background:#0f172a;border:1px solid #1e293b;border-radius:14px;padding:20px;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,textarea,select{box-sizing:border-box;width:100%;background:#020617;border:1px solid #334155;border-radius:8px;color:#e2e8f0;padding:10px;margin-top:5px}textarea{height:90px}label{font-size:13px;color:#cbd5e1}button{border:0;border-radius:8px;background:#22d3ee;color:#083344;padding:10px 14px;font-weight:700;cursor:pointer}.muted{background:#334155;color:#e2e8f0}.item{background:#020617;border-radius:8px;padding:12px;margin-top:10px}.out{white-space:pre-wrap;line-height:1.55;background:#020617;padding:14px;border-radius:8px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="tag">GITHUB PAGES EDITION</div><h1>AI Marketing Executive</h1><p>Create a marketing campaign directly in your browser. Your drafts are saved only on this device.</p><section class="card"><h2>Campaign creator</h2><div class="grid"><label>Campaign name<input id="name" placeholder="Modern House for Sale"></label><label>Type<select id="kind"><option>Property</option><option>Product</option><option>Service</option><option>Vehicle</option><option>Course</option><option>Business</option></select></label><label>Price<input id="price" placeholder="₹50 lakh"></label><label>Location<input id="location" placeholder="City / area"></label><label>Description<textarea id="description" placeholder="Describe what makes it special"></textarea></label><label>Target audience<textarea id="audience" placeholder="Who is this for?"></textarea></label><label>Features<textarea id="features" placeholder="Feature one, feature two"></textarea></label><label>Call to action<textarea id="cta" placeholder="Call today for a viewing"></textarea></label></div><p><button onclick="save()">Save campaign</button> <button class="muted" onclick="generate()">Generate marketing pack</button></p></section><section class="card"><h2>Saved campaigns</h2><div id="saved"><p>No saved campaigns yet.</p></div></section><section class="card"><h2>Marketing pack</h2><div class="out" id="output">Fill in your campaign, then choose “Generate marketing pack.”</div></section></main><script>const ids=['name','kind','price','location','description','audience','features','cta'];const key='ai-marketing-executive-campaigns';const get=()=>Object.fromEntries(ids.map(id=>[id,document.getElementById(id).value]));const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function all(){return JSON.parse(localStorage.getItem(key)||'[]')}function render(){let a=all();document.getElementById('saved').innerHTML=a.length?a.map((x,i)=>`<div class="item"><b>${esc(x.name)}</b> · ${esc(x.kind)}<br><small>${esc(x.location)} ${esc(x.price)}</small><br><button class="muted" onclick="load(${i})">Open</button></div>`).join(''):'<p>No saved campaigns yet.</p>'}function save(){let x=get();if(!x.name)return alert('Enter a campaign name.');let a=all();a.unshift(x);localStorage.setItem(key,JSON.stringify(a));render()}function load(i){let x=all()[i];ids.forEach(id=>document.getElementById(id).value=x[id]||'');window.scrollTo({top:0,behavior:'smooth'})}function generate(){let x=get(),n=x.name||'your campaign',d=x.description||('A standout '+x.kind.toLowerCase()),cta=x.cta||'Contact us to learn more.';document.getElementById('output').textContent=`MAIN AD\nDiscover ${n}. ${d}. ${x.price?'Price: '+x.price+'. ':''}${cta}\n\nINSTAGRAM\n✨ ${n}\n${d}\n${cta}\n\nYOUTUBE TITLE\nDiscover ${n}\n\nWHATSAPP\nHello! Sharing ${n}: ${d}. ${cta}\n\nHASHTAGS\n#Marketing #NewLaunch #DiscoverMore #LocalBusiness`}render()</script></body></html>
